<!DOCTYPE html>
<html>
<head>
  <title>Password Reset</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      background-color: #f7f7f7;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
    }
    .header {
      text-align: center;
      background-color: #007bff;
      color: #fff;
      padding: 20px;
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
    }
    .content {
      padding: 20px;
      background-color: #fff;
      border-bottom-left-radius: 10px;
      border-bottom-right-radius: 10px;
    }
    .button {
      display: inline-block;
      background-color: #007bff;
      color: #fff;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 5px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Password Reset</h1>
    </div>
    <div class="content">
      <p style="font-size: 18px;">Hello,</p>
      <p style="font-size: 16px;">You've requested a password reset. To reset your password, click the button below:</p>
      <p>
        <a class="button" href="https://yourwebsite.com/reset-password">Reset Password</a>
      </p>
      <p style="font-size: 16px;">If you didn't request a password reset, please ignore this email.</p>
      <p style="font-size: 16px;">Regards,<br>Your Company</p>
    </div>
  </div>
</body>
</html>
